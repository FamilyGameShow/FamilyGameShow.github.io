<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Escenario - Estado del Bingo y Habilitación de Pagos</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection, updateDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let numerosSalidosTodaLaNoche = [];
        let listaCartonesCompletos = [];
        let mapaDnisHabilitados = {};
        
        const audioAlerta = new Audio('https://assets.mixkit.co/active_storage/sfx/911/911-84.wav');

        // 1. ESCUCHAR EL ESTADO GENERAL DEL BOLILLERO
        onSnapshot(doc(db, "estado_show", "actual"), (docSnap) => {
            if (docSnap.exists()) {
                numerosSalidosTodaLaNoche = (docSnap.data().lista_numeros_salidos || []).map(String);
                
                document.getElementById('lblTotalBolas').innerText = numerosSalidosTodaLaNoche.length;
                let ult = docSnap.data().ultima_cancion_tocada || 0;
                document.getElementById('lblUltimaBola').innerText = ult > 0 ? String(ult).padStart(3, '0') : "000";
                procesarYMostrarMonitoreo();
            }
        });

        // 2. ESCUCHAR TODOS LOS DNIS / PAGOS REGISTRADOS
        onSnapshot(collection(db, "dnis_habilitados"), (snapshot) => {
            mapaDnisHabilitados = {};
            let pagados = 0;
            let pendientes = 0;

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const dniId = docSnap.id;
                mapaDnisHabilitados[dniId] = {
                    estado: data.estado || "pendiente",
                    nombre: data.nombre || "Participante",
                    comprobante_url: data.comprobante_url || null
                };
                if (data.estado === "pagado") pagados++;
                else pendientes++;
            });

            const lblPagados = document.getElementById('lblTotalPagados');
            const lblPendientes = document.getElementById('lblTotalPendientes');
            if (lblPagados) lblPagados.innerText = pagados;
            if (lblPendientes) lblPendientes.innerText = pendientes;

            procesarYMostrarMonitoreo();
        });

        // 3. ESCUCHAR TODOS LOS CARTONES ACTIVOS
        onSnapshot(collection(db, "cartones_vendidos"), (snapshot) => {
            listaCartonesCompletos = [];
            snapshot.forEach(doc => { 
                let d = doc.data();
                d.dni_doc = doc.id;
                listaCartonesCompletos.push(d); 
            });
            procesarYMostrarMonitoreo();
        });

        // 4. ALERTAS DE PREMIOS EN TIEMPO REAL
        onSnapshot(collection(db, "notificaciones_escenario"), (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const data = change.doc.data();
                    mostrarAlertaEmergenteVisual(data);
                }
            });
        });

        function mostrarAlertaEmergenteVisual(data) {
            const modal = document.getElementById('popUpGanador');
            const titulo = document.getElementById('popUpTitulo');
            const mensaje = document.getElementById('popUpMensaje');
            
            audioAlerta.play().catch(() => {});

            let esBolaLoca = data.con_bola_loca === true;
            
            if(data.tipo === "BINGO") {
                titulo.innerText = esBolaLoca ? "🔥 ¡BINGO + BOLA LOCA! 🔥" : "🏆 ¡BINGO LLENO! 🏆";
                modal.style.background = "linear-gradient(135deg, #e63946 0%, #ff0055 100%)";
                modal.style.color = "#fff";
            } else {
                titulo.innerText = esBolaLoca ? "🔥 ¡LÍNEA + BOLA LOCA! 🔥" : "🎉 ¡LÍNEA CANTADA! 🎉";
                modal.style.background = "linear-gradient(135deg, #ffd166 0%, #ff9f1c 100%)";
                modal.style.color = "#000";
            }

            mensaje.innerHTML = `El participante <strong>${data.nombre.toUpperCase()}</strong> (Cartón #${String(data.nro_carton).padStart(3, '0')}) acaba de ganar.<br><small style="opacity: 0.8;">DNI/Usuario: ${data.id_pago}</small>`;
            modal.style.display = "block";
        }

        window.cerrarAlertaEscenario = function() {
            document.getElementById('popUpGanador').style.display = "none";
        };

        // 5. INTERRUPTOR DE ESTADO DE PAGO
        window.toggleEstadoPagoDni = async function(dni, estadoActual, nombre) {
            const nuevoEstado = (estadoActual === "pagado") ? "pendiente" : "pagado";
            try {
                await setDoc(doc(db, "dnis_habilitados", dni), {
                    estado: nuevoEstado,
                    nombre: nombre || "Participante",
                    fecha_pago: serverTimestamp()
                }, { merge: true });
            } catch (e) {
                console.error("Error al actualizar estado:", e);
                alert("Error al cambiar estado.");
            }
        };

        // 6. HABILITAR DNI DIRECTO DESDE EL BUSCADOR
        window.habilitarDniManual = async function() {
            const txtDni = document.getElementById('txtDniManual');
            const txtNombre = document.getElementById('txtNombreManual');
            const dni = txtDni.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            const nombre = txtNombre.value.trim() || "Participante";

            if (!dni) { alert("Ingresá un DNI o código."); return; }

            try {
                await setDoc(doc(db, "dnis_habilitados", dni), {
                    estado: "pagado",
                    nombre: nombre,
                    fecha_pago: serverTimestamp(),
                    tipo: "manual_escenario"
                }, { merge: true });

                txtDni.value = "";
                txtNombre.value = "";
                alert(`✅ DNI ${dni} (${nombre}) habilitado con éxito.`);
            } catch (e) {
                alert("Error al habilitar DNI manual.");
            }
        };

        // 7. ELIMINAR DNI / CARTÓN
        window.eliminarRegistroDni = async function(dni) {
            if (!confirm(`¿Eliminar al DNI ${dni} de la lista?`)) return;
            try {
                await deleteDoc(doc(db, "dnis_habilitados", dni));
                await deleteDoc(doc(db, "cartones_vendidos", dni));
            } catch (e) {
                alert("Error al eliminar.");
            }
        };

        // 8. RENDERIZAR TABLA CON RANKING Y BOTONES DE HABILITACIÓN
        function procesarYMostrarMonitoreo() {
            const cuerpoTabla = document.getElementById('cuerpoTablaMonitoreo');
            if (!cuerpoTabla) return;

            let rankingJugadores = [];
            let dnisProcesados = new Set();

            // A) Procesar jugadores que ya tienen cartón activo
            listaCartonesCompletos.forEach(carton => {
                let dni = carton.id_pago || carton.dni_doc;
                dnisProcesados.add(dni);

                let numerosDelCarton = (carton.numeros || []).map(String);
                let aciertosTotales = 0;
                
                numerosDelCarton.forEach(num => { 
                    if (numerosSalidosTodaLaNoche.includes(num)) aciertosTotales++; 
                });

                let totalCasilleros = numerosDelCarton.length;
                let infoDni = mapaDnisHabilitados[dni] || {};
                let estadoPago = infoDni.estado || "pagado";

                rankingJugadores.push({
                    nroCarton: carton.nro_carton || 0,
                    nombre: carton.nombre_participante || infoDni.nombre || "Participante",
                    dni: dni,
                    numeros: numerosDelCarton,
                    aciertos: aciertosTotales,
                    faltantes: totalCasilleros - aciertosTotales,
                    totalCarton: totalCasilleros,
                    estadoPago: estadoPago,
                    comprobanteUrl: infoDni.comprobante_url || null,
                    tieneCarton: true
                });
            });

            // B) Procesar usuarios que están en lista de espera pero aún no tienen cartón
            Object.keys(mapaDnisHabilitados).forEach(dni => {
                if (!dnisProcesados.has(dni)) {
                    let infoDni = mapaDnisHabilitados[dni];
                    rankingJugadores.push({
                        nroCarton: "-",
                        nombre: infoDni.nombre || "En Espera",
                        dni: dni,
                        numeros: [],
                        aciertos: 0,
                        faltantes: 99,
                        totalCarton: 0,
                        estadoPago: infoDni.estado,
                        comprobanteUrl: infoDni.comprobante_url || null,
                        tieneCarton: false
                    });
                }
            });

            // Ordenar: primero los pendientes, luego los pagados por aciertos
            rankingJugadores.sort((a, b) => {
                if (a.estadoPago !== b.estadoPago) return a.estadoPago === "pendiente" ? -1 : 1;
                return b.aciertos - a.aciertos;
            });

            cuerpoTabla.innerHTML = "";
            
            if (rankingJugadores.length === 0) {
                cuerpoTabla.innerHTML = `<tr><td colspan="6" style="color: #64748b; padding: 30px; text-align: center;">Esperando que ingresen jugadores al show...</td></tr>`;
                return;
            }

            rankingJugadores.forEach(jugador => {
                const fila = document.createElement('tr');
                
                if (jugador.faltantes === 1 && jugador.tieneCarton) fila.classList.add('alerta-bingo-inminente');
                else if (jugador.faltantes === 2 && jugador.tieneCarton) fila.classList.add('alerta-casi-bingo');
                else if (jugador.estadoPago === "pendiente") fila.classList.add('fila-pendiente-pago');

                let bloquesNumerosHTML = "";
                if (jugador.numeros.length > 0) {
                    bloquesNumerosHTML = jugador.numeros.map(num => {
                        let salio = numerosSalidosTodaLaNoche.includes(num);
                        return `<span class="badge-numero ${salio ? 'bola-salida' : 'bola-espera'}">${String(num).padStart(2, '0')}</span>`;
                    }).join(" ");
                } else {
                    bloquesNumerosHTML = `<small style="color:#94a3b8; font-style:italic;">Esperando habilitación para generar cartón</small>`;
                }

                const esPagado = (jugador.estadoPago === "pagado");
                const btnSwitchHtml = `
                    <button class="btn-toggle-pago ${esPagado ? 'btn-pagado' : 'btn-pendiente'}" onclick="toggleEstadoPagoDni('${jugador.dni}', '${jugador.estadoPago}', '${jugador.nombre.replace(/'/g, "\\'")}')">
                        ${esPagado ? '🟢 PAGADO' : '🟡 PENDIENTE'}
                    </button>
                `;

                // Botón dinámico para ver el comprobante subido a ImgBB
                const btnComprobanteHtml = jugador.comprobanteUrl 
                    ? `<br><a href="${jugador.comprobanteUrl}" target="_blank" class="link-ver-comprobante">📸 Ver Comprobante</a>` 
                    : `<br><span style="color:#64748b; font-size:0.7rem;">Sin foto adjunta</span>`;

                fila.innerHTML = `
                    <td style="font-weight: bold; color: #00f5d4; text-align: center;">${jugador.nroCarton !== "-" ? '#' + String(jugador.nroCarton).padStart(3, '0') : '-'}</td>
                    <td>
                        <div style="font-weight: bold; text-transform: uppercase;">${jugador.nombre}</div>
                        <small style="color: #94a3b8;">DNI: ${jugador.dni}</small>
                        ${btnComprobanteHtml}
                    </td>
                    <td style="text-align: center;">${btnSwitchHtml}</td>
                    <td style="text-align: center;">
                        ${jugador.tieneCarton ? `<span class="contador-aciertos">${jugador.aciertos} / ${jugador.totalCarton}</span>` : '-'}
                    </td>
                    <td style="font-weight: bold; text-align: center;">
                        ${!jugador.tieneCarton ? '<span style="color:var(--gold);">En Espera ⏳</span>' : (jugador.faltantes === 0 ? '🏆 ¡BINGO! 🎉' : 'Faltan ' + jugador.faltantes)}
                    </td>
                    <td>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="contenedor-mini-carton">${bloquesNumerosHTML}</div>
                            <button class="btn-borrar-user" title="Eliminar participante" onclick="eliminarRegistroDni('${jugador.dni}')">🗑️</button>
                        </div>
                    </td>
                `;
                cuerpoTabla.appendChild(fila);
            });
        }
    </script>

    <style>
        :root { --dark-bg: #0b0f19; --card-bg: #141b2d; --cyan: #00f5d4; --gold: #ffd166; --primary: #e63946; --green: #2ec4b6; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background: var(--dark-bg); color: #fff; padding: 20px; overflow-x: hidden; }
        
        .header-escenario { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 25px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1f293d; flex-wrap: wrap; gap: 15px; }
        .header-escenario h1 { font-size: 1.3rem; color: var(--cyan); text-transform: uppercase; }
        .marcador-rapido { display: flex; gap: 12px; }
        .marcador-box { background: #0b0f19; padding: 8px 14px; border-radius: 8px; border: 1px solid #2e3c56; text-align: center; }
        .marcador-box span { display: block; font-size: 1.1rem; font-weight: bold; color: var(--gold); }

        /* Barra de Habilitación Rápida */
        .caja-habilitar-rapido { background: var(--card-bg); padding: 14px 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1f293d; display: flex; gap: 10px; align-items: center; }
        .caja-habilitar-rapido input { background: #0b0f19; border: 1px solid #2e3c56; padding: 10px 14px; border-radius: 8px; color: #fff; font-size: 0.9rem; flex: 1; }
        .btn-habilitar-manual { background: var(--green); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; }

        .tabla-container { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid #1f293d; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1f293d; color: #94a3b8; padding: 14px; font-size: 0.8rem; text-transform: uppercase; text-align: left; }
        td { padding: 10px 14px; border-bottom: 1px solid #1f293d; vertical-align: middle; }
        
        /* Botones Switch */
        .btn-toggle-pago { border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
        .btn-pagado { background: rgba(46, 196, 182, 0.2); color: var(--green); border: 1px solid var(--green); }
        .btn-pagado:hover { background: var(--green); color: #000; }
        .btn-pendiente { background: rgba(255, 209, 102, 0.2); color: var(--gold); border: 1px solid var(--gold); animation: titilarPendiente 1.5s infinite alternate; }
        .btn-pendiente:hover { background: var(--gold); color: #000; }
        @keyframes titilarPendiente { 0% { opacity: 0.7; } 100% { opacity: 1; box-shadow: 0 0 10px rgba(255,209,102,0.5); } }

        .link-ver-comprobante { color: var(--cyan); font-weight: bold; font-size: 0.75rem; text-decoration: underline; display: inline-block; margin-top: 4px; }
        .link-ver-comprobante:hover { color: #fff; }

        .fila-pendiente-pago { background: rgba(255, 209, 102, 0.03); }
        .contador-aciertos { background: rgba(0,245,212,0.15); color: var(--cyan); padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }
        .contenedor-mini-carton { display: flex; flex-wrap: wrap; gap: 4px; max-width: 440px; }
        .badge-numero { font-size: 0.75rem; font-weight: bold; padding: 3px 6px; border-radius: 4px; display: inline-block; min-width: 26px; text-align: center; }
        .bola-salida { background: #4caf50; color: #fff; }
        .bola-espera { background: #222e45; color: #64748b; }

        .btn-borrar-user { background: transparent; border: none; cursor: pointer; font-size: 1rem; padding: 4px 8px; opacity: 0.6; transition: opacity 0.2s; }
        .btn-borrar-user:hover { opacity: 1; }

        .alerta-casi-bingo { background: rgba(255, 209, 102, 0.05) !important; border-left: 5px solid var(--gold); }
        .alerta-bingo-inminente { background: rgba(230, 57, 70, 0.1) !important; border-left: 5px solid var(--primary); animation: pulsoRojo 1s infinite alternate; }
        @keyframes pulsoRojo { 0% { opacity: 0.8; } 100% { opacity: 1; } }

        /* POPUP EMERGENTE */
        .pop-up-ganador-abs { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 600px; padding: 40px; border-radius: 20px; z-index: 9999; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.8); border: 3px solid #fff; }
        .pop-up-ganador-abs h2 { font-size: 2.2rem; margin-bottom: 15px; text-transform: uppercase; }
        .pop-up-ganador-abs p { font-size: 1.3rem; margin-bottom: 25px; line-height: 1.6; }
        .btn-cerrar-pop { padding: 12px 30px; background: #000; color: #fff; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header-escenario">
        <h1>📊 Monitor de Cartones y Pagos en Vivo</h1>
        <div class="marcador-rapido">
            <div class="marcador-box">
                <span id="lblTotalPagados" style="color:var(--green);">0</span>
                <small>Pagados</small>
            </div>
            <div class="marcador-box">
                <span id="lblTotalPendientes" style="color:var(--gold);">0</span>
                <small>Pendientes</small>
            </div>
            <div class="marcador-box">
                <span id="lblUltimaBola">000</span>
                <small>Último Tema</small>
            </div>
            <div class="marcador-box">
                <span id="lblTotalBolas">0</span>
                <small>Cantados</small>
            </div>
        </div>
    </div>

    <!-- HABILITACIÓN RÁPIDA MANUAL -->
    <div class="caja-habilitar-rapido">
        <span style="font-size: 0.85rem; font-weight: bold; color: var(--cyan); white-space: nowrap;">⚡ Habilitar DNI al Paso:</span>
        <input type="text" id="txtDniManual" placeholder="DNI o Código...">
        <input type="text" id="txtNombreManual" placeholder="Nombre / Alias (Opcional)...">
        <button class="btn-habilitar-manual" onclick="habilitarDniManual()">Habilitar ✅</button>
    </div>

    <div class="tabla-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 8%; text-align: center;">Cartón</th>
                    <th style="width: 22%;">Participante</th>
                    <th style="width: 14%; text-align: center;">Habilitación</th>
                    <th style="width: 10%; text-align: center;">Aciertos</th>
                    <th style="width: 12%; text-align: center;">Estado</th>
                    <th style="width: 34%;">Matriz del Cartón</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaMonitoreo"></tbody>
        </table>
    </div>

    <div id="popUpGanador" class="pop-up-ganador-abs">
        <h2 id="popUpTitulo">🏆 ¡ALERTA GANADOR! 🏆</h2>
        <p id="popUpMensaje"></p>
        <button class="btn-cerrar-pop" onclick="cerrarAlertaEscenario()">OK, REANUDAR SHOW 🎙️</button>
    </div>

</body>
</html>
