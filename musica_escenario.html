<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escenario - DJ en Vivo</title>
    <style>
        body { 
            margin: 0; 
            background: #050505; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100vh; 
            overflow: hidden; 
        }
        .header { 
            background: rgba(255,255,255,0.05); 
            padding: 15px; 
            text-align: center; 
            font-size: 22px; 
            letter-spacing: 3px; 
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .centro { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            flex: 1; 
            text-align: center; 
            padding: 10px;
        }
        .player-container {
            width: 80%;
            max-width: 850px;
            height: 480px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,255,127,0.3);
            margin-bottom: 15px;
        }
        #youtube-player { width: 100%; height: 100%; }
        .info-card {
            background: rgba(255,255,255,0.05);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { font-size: 26px; margin: 4px 0; color: #ffeb3b; }
        p { font-size: 18px; margin: 0; color: #aaa; }
        .footer-publi { 
            background: #111; 
            padding: 12px; 
            text-align: center; 
            font-size: 16px; 
            color: #888; 
            border-top: 1px solid #222; 
        }
    </style>
</head>
<body>

    <div class="header">🎉 FIESTA EN VIVO - DJ INTERACTIVO 🎉</div>

    <div class="centro">
        <div class="player-container">
            <div id="youtube-player"></div>
        </div>

        <div class="info-card">
            <h2 id="tituloTema">Esperando próximo tema...</h2>
            <p id="pedidoPor">Escaneá el QR para pedir tu canción 🎶</p>
        </div>
    </div>

    <div class="footer-publi">📢 ¡Transmitiendo en vivo para todo el salón!</div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let player;
        let videoIdPorDefecto = "jfKfPfyJRdk"; // Video comodín inicial

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: videoIdPorDefecto,
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 }
            });
        };

        // Escuchar el estado actual que manda el admin
        onSnapshot(doc(db, "fiesta_musical", "estado_actual"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const cancionTexto = data.cancion || "Silencio en la pista";
                const solicitante = data.pedidoPor || "Invitado";
                const ytId = data.youtubeId || "jfKfPfyJRdk";
                
                document.getElementById("tituloTema").innerText = `🎵 ${cancionTexto}`;
                document.getElementById("pedidoPor").innerText = `Pedido por: ${solicitante}`;

                if (player && typeof player.loadVideoById === 'function') {
                    player.loadVideoById(ytId);
                }
            }
        });
    </script>
</body>
</html>
