<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escenario - DJ en Vivo</title>
    <style>
        body { 
            margin: 0; 
            background: #050505; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100vh; 
            overflow: hidden; 
        }
        .header { 
            background: rgba(255,255,255,0.05); 
            padding: 25px; 
            text-align: center; 
            font-size: 26px; 
            letter-spacing: 3px; 
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .centro { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            flex: 1; 
            text-align: center; 
            padding: 20px;
        }
        .card-tema {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            padding: 50px 70px; 
            border-radius: 25px;
            box-shadow: 0 0 60px rgba(255,0,127,0.5);
            animation: latido 2s infinite alternate;
            max-width: 900px;
        }
        .etiqueta-vivo { 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            font-size: 20px; 
            color: #ffeb3b; 
            margin: 0; 
            font-weight: bold;
        }
        h1 { font-size: 55px; margin: 15px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        h2 { font-size: 35px; color: #fff; margin: 0; font-weight: normal; }
        
        @keyframes latido {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(255,0,127,0.4); }
            100% { transform: scale(1.02); box-shadow: 0 0 70px rgba(255,0,127,0.8); }
        }

        .footer-publi { 
            background: #111; 
            padding: 20px; 
            text-align: center; 
            font-size: 20px; 
            color: #aaa; 
            border-top: 1px solid #222; 
        }
    </style>
</head>
<body>

    <div class="header">🎉 FIESTA EN VIVO - DJ INTERACTIVO 🎉</div>

    <div class="centro">
        <div class="card-tema">
            <p class="etiqueta-vivo">▶️ Sonando ahora:</p>
            <h1 id="tituloTema">Cargando próximo tema...</h1>
            <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.3); margin: 25px 0;">
            <h2 id="pedidoPor">¡Preparate para bailar! 🎶</h2>
        </div>
    </div>

    <div class="footer-publi" id="textoPubli">
        📢 Escaneá el código QR en las mesas para pedir tu tema y participar de los juegos.
    </div>

    <!-- Script con Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Escuchar en tiempo real los cambios en el documento estado_actual
        onSnapshot(doc(db, "fiesta_musical", "estado_actual"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById("tituloTema").innerText = data.cancion || "Silencio en la pista";
                document.getElementById("pedidoPor").innerText = data.pedidoPor ? `¡Elegido por ${data.pedidoPor}! 🎧` : "¡A bailar!";
            }
        });
    </script>
</body>
</html>
