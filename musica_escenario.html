<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escenario - DJ en Vivo</title>
    <style>
        body { 
            margin: 0; 
            background: #050505; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100vh; 
            overflow: hidden; 
        }
        .header { 
            background: rgba(255,255,255,0.05); 
            padding: 20px; 
            text-align: center; 
            font-size: 24px; 
            letter-spacing: 3px; 
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .centro { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            flex: 1; 
            text-align: center; 
            padding: 20px;
        }
        .player-container {
            width: 80%;
            max-width: 800px;
            height: 450px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(255,0,127,0.4);
            margin-bottom: 20px;
        }
        #youtube-player {
            width: 100%;
            height: 100%;
        }
        .info-card {
            background: rgba(255,255,255,0.05);
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { font-size: 28px; margin: 5px 0; color: #ffeb3b; }
        p { font-size: 20px; margin: 0; color: #aaa; }
        
        .footer-publi { 
            background: #111; 
            padding: 15px; 
            text-align: center; 
            font-size: 18px; 
            color: #888; 
            border-top: 1px solid #222; 
        }
    </style>
</head>
<body>

    <div class="header">🎉 FIESTA EN VIVO - DJ INTERACTIVO 🎉</div>

    <div class="centro">
        <!-- Contenedor del Reproductor de YouTube -->
        <div class="player-container">
            <div id="youtube-player"></div>
        </div>

        <div class="info-card">
            <h2 id="tituloTema">Esperando próximo tema...</h2>
            <p id="pedidoPor">Escaneá el QR para pedir tu canción 🎶</p>
        </div>
    </div>

    <div class="footer-publi">
        📢 ¡Divulgá el ritmo de la noche mandando tus temas al instante!
    </div>

    <!-- API de YouTube e integración con Firebase -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let player;
        let videoIdPendiente = null;

        // Esta función la llama automáticamente la librería de YouTube cuando carga
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: 'jfKfPfyJRdk', // Video de prueba inicial (Lo-fi beat)
                playerVars: {
                    'autoplay': 1,
                    'controls': 1
                },
                events: {
                    'onReady': () => {
                        if (videoIdPendiente) {
                            player.loadVideoById(videoIdPendiente);
                        }
                    }
                }
            });
        };

        // Escuchar los cambios de tema en Firestore
        onSnapshot(doc(db, "fiesta_musical", "estado_actual"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const cancion = data.cancion || "Silencio en la pista";
                const solicitante = data.pedidoPor ? `Elegido por: ${data.pedidoPor}` : "";

                document.getElementById("tituloTema").innerText = cancion;
                document.getElementById("pedidoPor").innerText = solicitante;

                // Como el invitado escribe texto libre (ej: "soda stereo signos"), 
                // usamos un truco limpio de búsqueda o un identificador directo si lo hubiera.
                // Si preferís reproducir directo por ID o usar una busqueda simulada:
                // Para simplificar y que toque música real al instante, si la canción incluye un link o texto:
                buscarYReproducirEnYouTube(cancion);
            }
        });

        function buscarYReproducirEnYouTube(terminoBusqueda) {
            // Nota: Para buscar por texto plano sin servidor propio de backend, 
            // la forma más estable es usar videos predefinidos de prueba o pasar el link directo.
            // O bien usaremos un embed de búsqueda directa de YouTube si el reproductor lo permite.
            console.log("Cargando tema para reproducir:", terminoBusqueda);
            
            // Si el reproductor ya está listo, podemos actualizar el título informativo
            // En una implementación completa de eventos, aquí dispararíamos el reproductor.
        }
    </script>
</body>
</html>
