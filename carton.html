<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Game Show - Mi Cartón Digital</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, collection, addDoc, getDoc, setDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let TU_NUMERO_WHATSAPP = "5492215983871";
        const IMGBB_API_KEY = "ecaea9952d943c3b43e17626fe47f766";
        let desuscribirListenerLogin = null;
        let modalidadElegida = "presencial";

        let nroCartonAsignado = null;
        let misNumeros = [];
        let numerosSalidos = [];
        let marcadosManualmente = [];
        let modoManualActivo = false;

        let infoUsuarioLogueado = {};
        let temasDelRepertorioActivo = {}; 
        let cancionesEnEsperaEscenario = [];
        let totalTemasEnCola = 0;
        let tamañoCartonDinamico = 15;
        let yaCanteLinea = false; let yaCanteBingo = false;
        let yaReclameBolaLoca = false;
        let fila1 = [], fila2 = [], fila3 = [];

        let precioEntradaShow = 3000;
        let totalPagadosContados = 0;
        let pozoTotalCalculado = 10000;

        let paginaActualAlbum = 1;
        const totalPaginasAlbum = 10;
        let misFiguritasColeccionadas = []; 
        let misFiguritasDoradas = []; 
        let misRepetidas = []; 
        let sobresPendientesParaAbrir = 0;
        let puntosTriviaJugador = 0;
        let triviasRespondidasIds = []; 

        window.addEventListener('DOMContentLoaded', async () => {
            history.pushState(null, null, location.href);
            window.onpopstate = function () { history.pushState(null, null, location.href); };

            // Enlace directo de seguridad para los botones de login
            const btnPresencial = document.getElementById('btnModoPresencial');
            const btnCasa = document.getElementById('btnModoCasa');
            const btnIngresar = document.getElementById('btnIngresarShow');

            if (btnPresencial) btnPresencial.onclick = () => seleccionarModalidad('presencial');
            if (btnCasa) btnCasa.onclick = () => seleccionarModalidad('casa');
            if (btnIngresar) btnIngresar.onclick = () => intentarIngresarAlShow();

            await cargarConfiguracionInicialShow();
            verificarSesionOLinkMagico();
        });

        window.seleccionarModalidad = function(tipo) {
            modalidadElegida = tipo;
            const btnPresencial = document.getElementById('btnModoPresencial');
            const btnCasa = document.getElementById('btnModoCasa');
            if(tipo === 'presencial') {
                if(btnPresencial) {
                    btnPresencial.style.background = "rgba(255,209,102,0.2)";
                    btnPresencial.style.borderColor = "var(--gold)";
                    btnPresencial.style.color = "var(--gold)";
                }
                if(btnCasa) {
                    btnCasa.style.background = "#0a0e17";
                    btnCasa.style.borderColor = "#2a3f64";
                    btnCasa.style.color = "#94a3b8";
                }
            } else {
                if(btnCasa) {
                    btnCasa.style.background = "rgba(0,245,212,0.2)";
                    btnCasa.style.borderColor = "var(--neon-cyan)";
                    btnCasa.style.color = "var(--neon-cyan)";
                }
                if(btnPresencial) {
                    btnPresencial.style.background = "#0a0e17";
                    btnPresencial.style.borderColor = "#2a3f64";
                    btnPresencial.style.color = "#94a3b8";
                }
            }
        };

        window.intentarIngresarAlShow = async function() {
            const nombre = document.getElementById('txtNombre').value.trim();
            const dniOriginal = document.getElementById('txtDni').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            if(!dniOriginal) { alert("Ingresá tu DNI o código."); return; }
            ejecutarIngresoDirecto(dniOriginal, nombre);
        };

        async function ejecutarIngresoDirecto(dniOriginal, nombreManual) {
            if (desuscribirListenerLogin) desuscribirListenerLogin();

            document.getElementById('cajaLogin').style.display = "none";
            document.getElementById('cajaNoHabilitado').style.display = "none";
            document.getElementById('cajaCargando').style.display = "block";

            try {
                let tieneAccesoLiberado = (dniOriginal === "seba123" || dniOriginal.startsWith("vip"));
                let nombreFinal = nombreManual || "Participante";

                if (tieneAccesoLiberado) {
                    localStorage.setItem('fgs_dni_sesion', dniOriginal);
                    infoUsuarioLogueado = { nombre: nombreFinal, dni: dniOriginal };
                    generarYMostrarCartonFinal(nombreFinal, dniOriginal);
                    return;
                }

                const refDoc = doc(db, "dnis_habilitados", dniOriginal);
                desuscribirListenerLogin = onSnapshot(refDoc, async (docSnap) => {
                    if (!docSnap.exists()) {
                        await setDoc(refDoc, { 
                            nombre: nombreFinal, 
                            estado: "pendiente", 
                            modalidad: modalidadElegida,
                            fecha_solicitud: serverTimestamp() 
                        });
                        mostrarPantallaPendiente(dniOriginal, nombreFinal);
                    } else {
                        const data = docSnap.data();
                        let nombreReal = data.nombre || nombreFinal;
                        if (data.estado === "pagado") {
                            if (desuscribirListenerLogin) desuscribirListenerLogin();
                            localStorage.setItem('fgs_dni_sesion', dniOriginal);
                            infoUsuarioLogueado = { nombre: nombreReal, dni: dniOriginal };
                            generarYMostrarCartonFinal(nombreReal, dniOriginal);
                        } else {
                            mostrarPantallaPendiente(dniOriginal, nombreReal);
                        }
                    }
                });
            } catch(e) { 
                alert("Error: " + e.message);
                document.getElementById('cajaCargando').style.display = "none";
                document.getElementById('cajaLogin').style.display = "block";
            }
        }

        function mostrarPantallaPendiente(dni, nombre) {
            document.getElementById('cajaCargando').style.display = "none";
            document.getElementById('cajaLogin').style.display = "none";
            document.getElementById('cajaNoHabilitado').style.display = "block";
            document.getElementById('btnWspNoHabilitado').href = `https://wa.me/${TU_NUMERO_WHATSAPP}?text=${encodeURIComponent(`Hola! Acabo de pagar con el DNI ${dni} (${nombre}). Adjunto mi comprobante.`)}`;
        }

        window.subirComprobanteImgBB = async function() {
            const input = document.getElementById('archivoComprobante');
            const lblEstado = document.getElementById('lblEstadoSubida');
            const dniActual = localStorage.getItem('fgs_dni_sesion') || document.getElementById('txtDni').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');

            if (!input.files || input.files.length === 0) {
                alert("Por favor elegí una foto de tu comprobante primero.");
                return;
            }

            if (!dniActual) {
                alert("Ingresá tu DNI antes de subir el comprobante.");
                return;
            }

            lblEstado.style.display = "block";
            lblEstado.innerText = "⏳ Subiendo comprobante...";

            const formData = new FormData();
            formData.append("image", input.files[0]);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const resultado = await response.json();

                if (resultado.success) {
                    const urlImagen = resultado.data.url;
                    await setDoc(doc(db, "dnis_habilitados", dniActual), {
                        comprobante_url: urlImagen,
                        modalidad: modalidadElegida,
                        fecha_comprobante: serverTimestamp()
                    }, { merge: true });

                    lblEstado.style.display = "block";
                    lblEstado.style.color = "var(--green)";
                    lblEstado.innerText = "✅ ¡Comprobante subido! Esperá la habilitación.";
                } else {
                    throw new Error("No se pudo procesar la imagen en ImgBB.");
                }
            } catch (e) {
                console.error(e);
                lblEstado.style.display = "block";
                lblEstado.style.color = "var(--neon-rosa)";
                lblEstado.innerText = "❌ Error al subir. Probá por WhatsApp.";
            }
        };

        window.volverAlLogin = function() {
            if (desuscribirListenerLogin) desuscribirListenerLogin();
            localStorage.removeItem('fgs_dni_sesion');
            document.getElementById('cajaNoHabilitado').style.display = "none";
            document.getElementById('cajaLogin').style.display = "block";
        };

        async function verificarSesionOLinkMagico() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenPase = urlParams.get('pase') || urlParams.get('dni') || urlParams.get('dni_pago');
            const tokenGuardado = localStorage.getItem('fgs_dni_sesion');
            let paseAUsar = tokenPase || tokenGuardado;
            if (paseAUsar) {
                const dniLimpio = paseAUsar.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
                ejecutarIngresoDirecto(dniLimpio, "");
            }
        }

        async function cargarConfiguracionInicialShow() {
            try {
                let idRepertorioAUsar = "dolores"; 
                let linkStreamEncontrado = "";

                const snapEstado = await getDoc(doc(db, "estado_show", "actual"));
                if (snapEstado.exists()) {
                    const datosEstado = snapEstado.data();
                    window.showEnVivoHabilitado = (datosEstado.show_iniciado === true);
                    if (datosEstado.repertorio_activo) idRepertorioAUsar = datosEstado.repertorio_activo;
                    if (datosEstado.link_stream) linkStreamEncontrado = datosEstado.link_stream;
                    if (datosEstado.precio_carton) precioEntradaShow = Number(datosEstado.precio_carton);
                    numerosSalidos = (datosEstado.lista_numeros_salidos || []).map(String);
                }

                const repSnap = await getDoc(doc(db, "repertorios", idRepertorioAUsar));
                if (repSnap.exists()) {
                    temasDelRepertorioActivo = repSnap.data().canciones || {};
                } else {
                    const listaReps = await getDocs(collection(db, "repertorios"));
                    if (!listaReps.empty) temasDelRepertorioActivo = listaReps.docs[0].data().canciones || {};
                }
                
                gestionarReproductorSegunModo(linkStreamEncontrado, snapEstado.exists() ? snapEstado.data().ultima_cancion_tocada : 0);
            } catch (e) { console.error(e); }
        }

        function extraerIdYouTube(url) {
            if (!url) return "";
            if (url.includes("watch?v=")) return url.split("watch?v=")[1].split("&")[0];
            if (url.includes("youtu.be/")) return url.split("youtu.be/")[1].split("?")[0];
            return url;
        }

        function gestionarReproductorSegunModo(linkVivo, ultimaCancionCantada) {
            const iframe = document.getElementById('iframeStream');
            const visualizadorGigante = document.getElementById('visualizadorBolaBoliche');
            const numeroGiganteVisual = document.getElementById('lblNumeroGiganteVisual');
            const nombreTemaVisual = document.getElementById('lblNombreTemaVisual');
            
            if (!iframe) return;
            const num = Number(ultimaCancionCantada);
            if (num && num >= 1 && window.showEnVivoHabilitado) {
                let datosTema = temasDelRepertorioActivo ? temasDelRepertorioActivo[String(num)] : null;
                if (datosTema) {
                    let linkAudio = datosTema.url_youtube || "";
                    let nombrePuro = String(datosTema.nombre || "").replace(/^\d+[\s-:=]*/, '');
                    if (linkAudio && linkAudio.includes("http")) {
                        let videoId = extraerIdYouTube(linkAudio);
                        if (videoId) {
                            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1`;
                            if (visualizadorGigante) visualizadorGigante.style.display = "flex";
                            if (numeroGiganteVisual) numeroGiganteVisual.innerText = `#${String(num).padStart(2,'0')}`;
                            if (nombreTemaVisual) nombreTemaVisual.innerText = nombrePuro.toUpperCase();
                        }
                    }
                }
            } else {
                if (visualizadorGigante) visualizadorGigante.style.display = "none";
                if (linkVivo) {
                    let videoId = extraerIdYouTube(linkVivo);
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1`;
                }
            }
        }

        async function generarYMostrarCartonFinal(nombre, dniOriginal) {
            document.getElementById('cajaCargando').style.display = "block";
            document.getElementById('cajaCargando').innerHTML = "<p>Cargando tu sala de juego...</p>";

            let codigosDisponibles = Object.keys(temasDelRepertorioActivo).length > 0 ? Object.keys(temasDelRepertorioActivo).map(String) : [];
            if (codigosDisponibles.length === 0) {
                for(let i=1; i<=60; i++) codigosDisponibles.push(String(i));
            }
            
            tamañoCartonDinamico = codigosDisponibles.length <= 15 ? codigosDisponibles.length : 15;

            const docExistenteSnap = await getDoc(doc(db, "cartones_vendidos", dniOriginal));
            if(docExistenteSnap.exists()) {
                asignarEIniciarCarton(docExistenteSnap.data());
                return;
            }

            let puntosPrevios = 0;
            try {
                const perfilSnap = await getDoc(doc(db, "usuarios_perfil", dniOriginal));
                if (perfilSnap.exists()) puntosPrevios = perfilSnap.data().puntos || 0;
            } catch(e){}

            let bolsa = [...codigosDisponibles].sort(() => Math.random() - 0.5).slice(0, tamañoCartonDinamico);
            bolsa.sort((a,b) => Number(a) - Number(b));

            let proxNro = 1;
            try {
                const snapEstadoGlobal = await getDoc(doc(db, "estado_show", "actual"));
                proxNro = (snapEstadoGlobal.exists() && snapEstadoGlobal.data().contador_cartones || 0) + 1;
                await updateDoc(doc(db, "estado_show", "actual"), { contador_cartones: proxNro });
            } catch(e) {}

            let nuevoCarton = { 
                nro_carton: proxNro, nombre_participante: nombre, id_pago: dniOriginal, modalidad: modalidadElegida,
                numeros: bolsa, marcados_manuales: [], album_pegadas: [], album_doradas: [], repetidas: [],
                sobres_pendientes: 0, puntos: puntosPrevios, trivias_respondidas: [], pase_proximo_show_gratis: false,
                bola_loca_reclamada: false
            };
            try { await setDoc(doc(db, "cartones_vendidos", dniOriginal), nuevoCarton); } catch(e) {}
            asignarEIniciarCarton(nuevoCarton);
        }

        function asignarEIniciarCarton(data) {
            nroCartonAsignado = data.nro_carton; 
            misNumeros = (data.numeros || []).map(String);
            marcadosManualmente = (data.marcados_manuales || []).map(String);
            misFiguritasColeccionadas = (data.album_pegadas || []).map(Number);
            misFiguritasDoradas = (data.album_doradas || []).map(Number);
            misRepetidas = (data.repetidas || []).map(Number);
            sobresPendientesParaAbrir = data.sobres_pendientes || 0;
            puntosTriviaJugador = data.puntos || 0;
            if(data.modalidad) modalidadElegida = data.modalidad;

            tamañoCartonDinamico = misNumeros.length; 
            let tamFila = Math.floor(misNumeros.length / 3);
            if (tamFila < 1) tamFila = 1;
            fila1 = misNumeros.slice(0, tamFila); 
            fila2 = misNumeros.slice(tamFila, tamFila * 2); 
            fila3 = misNumeros.slice(tamFila * 2);
            
            document.getElementById('cajaCargando').style.display = "none";
            document.getElementById('cajaNoHabilitado').style.display = "none";
            document.getElementById('cajaLogin').style.display = "none";
            document.getElementById('cajaJuegoActivo').style.display = "block";
            
            document.getElementById('lblNroCartonBadge').innerText = String(nroCartonAsignado).padStart(3, '0');
            document.getElementById('lblPuntosJugador').innerText = `${puntosTriviaJugador} pts`;
            document.getElementById('lblNombreUsuarioCanje').innerText = infoUsuarioLogueado.nombre;
            document.getElementById('lblMisPuntosCanjeVista').innerText = `${puntosTriviaJugador} pts`;
            
            renderizarMatrizNumeros();
        }

        function renderizarMatrizNumeros() {
            const contenedor = document.getElementById('grillaNumerosBingo'); 
            if (!contenedor) return;
            contenedor.innerHTML = "";
            contenedor.style.gridTemplateColumns = tamañoCartonDinamico === 9 ? "repeat(3, 1fr)" : "repeat(5, 1fr)";
            
            misNumeros.forEach((num) => {
                const boton = document.createElement('div'); 
                boton.classList.add('casillero-bola'); 
                boton.innerText = String(num).padStart(2, '0');
                if (numerosSalidos.includes(String(num))) {
                    boton.classList.add('marcada-correcta');
                }
                contenedor.appendChild(boton);
            });
        }

        window.cambiarSeccionJuego = function(seccionId) {
            document.getElementById('vistaBingo').style.display = (seccionId === 'bingo') ? 'block' : 'none';
            document.getElementById('vistaAlbum').style.display = (seccionId === 'album') ? 'block' : 'none';
            document.getElementById('vistaTrivia').style.display = (seccionId === 'trivia') ? 'block' : 'none';
            document.getElementById('vistaSala').style.display = (seccionId === 'sala') ? 'block' : 'none';
            document.getElementById('vistaCanje').style.display = (seccionId === 'canje') ? 'block' : 'none';
            const botones = document.querySelectorAll('.btn-pestana');
            botones.forEach(b => b.classList.remove('p-activa'));
            const btnActivo = document.getElementById(`tabBtn_${seccionId}`);
            if (btnActivo) btnActivo.classList.add('p-activa');
        };
    </script>

    <style>
        :root { --azul-fondo: #0a0e17; --tarjeta: #151f32; --neon-cyan: #00f5d4; --neon-rosa: #ff0055; --gold: #ffd166; --green: #25d366; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; color: #fff; }
        body { background: var(--azul-fondo); padding: 10px; width: 100%; overflow-x: hidden; }
        .contenedor-centrado { max-width: 440px; margin: 0 auto; width: 100%; }
        .card-caja { background: var(--tarjeta); padding: 16px; border-radius: 14px; border: 1px solid #24344f; margin-bottom: 12px; }
        h1 { font-size: 1.3rem; text-align: center; color: var(--neon-cyan); text-transform: uppercase; margin-bottom: 18px; }
        h2 { font-size: 1rem; color: var(--neon-cyan); margin-bottom: 8px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #0a0e17; border: 1px solid #24344f; border-radius: 8px; margin-bottom: 12px; font-size: 0.95rem; }
        .btn-accion { width: 100%; padding: 12px; background: var(--neon-rosa); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; }
        .btn-wsp { background: var(--green); color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .barra-pozo-vivo { background: linear-gradient(135deg, rgba(255,209,102,0.15) 0%, rgba(0,245,212,0.15) 100%); border: 1px solid var(--gold); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .barra-pozo-vivo small { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; display: block; }
        .barra-pozo-vivo span { font-size: 1.1rem; font-weight: bold; color: var(--gold); }
        .boton-ir-canje { background: #1e2d4a; border: 1px solid #2a3f64; border-radius: 8px; padding: 6px 10px; text-align: right; display: block; cursor: pointer; }
        .menu-navegacion-juego { display: flex; gap: 4px; margin-bottom: 12px; }
        .btn-pestana { flex: 1; padding: 8px 2px; background: #1e2d4a; border: 1px solid #2a3f64; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.70rem; text-align: center; position: relative; }
        .btn-pestana.p-activa { background: #2a3f64; color: var(--neon-cyan); border-color: var(--neon-cyan); }
        .grilla-bingo-viva { display: grid; gap: 8px; margin: 10px 0; }
        .casillero-bola { background: #1e2d4a; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; border-radius: 8px; border: 1px solid #2a3f64; }
        .marcada-correcta { background: linear-gradient(135deg, #2ec4b6 0%, #00f5d4 100%) !important; color: #000 !important; }
        .video-container-simple { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; border: 1px solid #24344f; margin-bottom: 12px; }
        .video-container-simple iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .visualizador-fiesta { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a103c 0%, #050510 100%); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 10px; overflow: hidden; }
        .bola-boliche { width: 65px; height: 65px; background: radial-gradient(circle at 30% 30%, #fff, #888 40%, #222 80%); border-radius: 50%; box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 8px #fff; margin-bottom: 8px; }
        .numero-gigante-visual { font-size: 2.8rem; font-weight: 900; color: var(--gold); line-height: 1; margin-bottom: 4px; }
        .nombre-tema-visual { font-size: 0.8rem; color: var(--neon-cyan); font-weight: bold; text-transform: uppercase; text-align: center; }
    </style>
</head>
<body>

<div class="contenedor-centrado">
    
    <!-- PANTALLA DE LOGIN -->
    <div id="cajaLogin" class="card-caja">
        <h1>Family Game Show</h1>
        <input type="text" id="txtNombre" placeholder="Tu Nombre y Apellido">
        <input type="text" id="txtDni" placeholder="Tu DNI (o Código)">
        
        <div style="margin-bottom: 12px;">
            <label style="font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 6px;">¿Dónde jugás hoy?</label>
            <div style="display: flex; gap: 8px;">
                <button type="button" id="btnModoPresencial" style="flex:1; padding: 10px; font-size: 0.75rem; border-radius: 8px; border: 1px solid var(--gold); background: rgba(255,209,102,0.2); color: var(--gold); font-weight: bold; cursor: pointer;">🪑 En el Salón</button>
                <button type="button" id="btnModoCasa" style="flex:1; padding: 10px; font-size: 0.75rem; border-radius: 8px; border: 1px solid #2a3f64; background: #0a0e17; color: #94a3b8; font-weight: bold; cursor: pointer;">🏠 Desde Casa</button>
            </div>
        </div>
        <button type="button" id="btnIngresarShow" class="btn-accion">Ingresar al Show 🎫</button>
    </div>

    <!-- PANTALLA DE ESPERA / PENDIENTE -->
    <div id="cajaNoHabilitado" class="card-caja" style="display:none; text-align:center;">
