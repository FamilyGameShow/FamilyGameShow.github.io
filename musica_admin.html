<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Control Total de la Fiesta</title>
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #1db954; border-bottom: 2px solid #333; padding-bottom: 8px; margin-top: 0; }
        ul { padding-left: 20px; }
        li { background: #2a2a2a; margin: 8px 0; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #1db954; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background: #1ed760; }
        button.skip { background: #e91e63; }
        .modo-btn { background: #555; margin-right: 5px; }
        .modo-btn.activo { background: #7f00ff; }
        .current-track-info { font-size: 18px; font-weight: bold; color: #ffeb3b; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎛️ Panel de Control - DJ Fiesta Admin</h1>

        <!-- Control de Modos (Música, Trivia, Votación) -->
        <div class="card">
            <h2>🎮 Cambiar Modo de la Fiesta (Pantallas de Invitados)</h2>
            <p style="color: #aaa; font-size: 14px;">Hacé clic para cambiar lo que ven los invitados en sus celulares al escanear el QR:</p>
            <div>
                <button id="btnMusica" class="modo-btn" onclick="cambiarModo('musica')">🎵 Modo Música</button>
                <button id="btnTrivia" class="modo-btn" onclick="cambiarModo('trivia')">🧠 Modo Trivia</button>
                <button id="btnVotacion" class="modo-btn" onclick="cambiarModo('votacion')">🎤 Modo Votación</button>
            </div>
        </div>

        <!-- Reproductor Actual -->
        <div class="card">
            <h2>Sonando Ahora</h2>
            <div class="current-track-info" id="temaActual">▶️ Cargando estado actual...</div>
            <button onclick="siguienteTema()" class="skip" style="width: 100%; margin-top: 10px;">▶️ Reproducer Siguiente Tema de la Cola</button>
        </div>

        <!-- Cola de Espera -->
        <div class="card">
            <h2>🎵 Cola de Espera (Pedidos de la Gente)</h2>
            <ul id="listaCola">
                <li>Cargando cola de reproducción...</li>
            </ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, collection, getDocs, deleteDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Cambiar el modo de la fiesta en Firestore
        window.cambiarModo = async function(nuevoModo) {
            try {
                await setDoc(doc(db, "fiesta_musical", "modo_interactivo"), {
                    modo: nuevoModo
                }, { merge: true });
                alert(`¡Modo cambiado a: ${nuevoModo.toUpperCase()}! 🚀`);
            } catch (error) {
                console.error("Error al cambiar modo:", error);
            }
        }

        // Resaltar el botón activo según Firebase
        onSnapshot(doc(db, "fiesta_musical", "modo_interactivo"), (docSnap) => {
            if (docSnap.exists()) {
                const modo = docSnap.data().modo || "musica";
                document.querySelectorAll('.modo-btn').forEach(b => b.classList.remove('activo'));
                if (modo === 'trivia') document.getElementById('btnTrivia').classList.add('activo');
                else if (modo === 'votacion') document.getElementById('btnVotacion').classList.add('activo');
                else document.getElementById('btnMusica').classList.add('activo');
            }
        });

        // Mostrar tema actual
        onSnapshot(doc(db, "fiesta_musical", "estado_actual"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById("temaActual").innerText = `▶️ ${data.cancion || "Sin reproductor activo"} (Pedido por: ${data.pedidoPor || "N/A"})`;
            }
        });

        // Escuchar cola de reproducción raíz
        const qCola = query(collection(db, "cola_reproduccion"), orderBy("timestamp", "asc"));
        onSnapshot(qCola, (snapshot) => {
            const listaCola = document.getElementById("listaCola");
            listaCola.innerHTML = "";
            if (snapshot.empty) {
                listaCola.innerHTML = "<li>No hay temas en espera.</li>";
                return;
            }
            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const li = document.createElement("li");
                li.innerHTML = `<span>🎵 <strong>${item.cancion}</strong></span> <small style="color:#aaa;">Por: ${item.pedidoPor}</small>`;
                listaCola.appendChild(li);
            });
        });

        // Pasar al siguiente tema
        window.siguienteTema = async function() {
            try {
                const querySnapshot = await getDocs(query(collection(db, "cola_reproduccion"), orderBy("timestamp", "asc"), limit(1)));
                if (querySnapshot.empty) {
                    alert("No hay más temas en la cola.");
                    return;
                }
                const primerDoc = querySnapshot.docs[0];
                const datosTema = primerDoc.data();

                await setDoc(doc(db, "fiesta_musical", "estado_actual"), {
                    cancion: datosTema.cancion,
                    pedidoPor: datosTema.pedidoPor
                });

                await deleteDoc(doc(db, "cola_reproduccion", primerDoc.id));
            } catch (error) {
                console.error("Error al avanzar tema:", error);
            }
        }
    </script>
</body>
</html>
