<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiesta Musical - Jazz Covers</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #1DB954; }
        .lista-canciones { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; margin-top: 20px; }
        .item-cancion { display: flex; justify-content: space-between; align-items: center; background: #181818; padding: 12px 15px; border-radius: 8px; border: 1px solid #282828; }
        .info-tema { display: flex; gap: 15px; align-items: center; }
        .titulo { font-size: 0.95rem; }
        .btn-pedir { background: transparent; border: 1px solid #1DB954; color: #1DB954; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-weight: bold; }
        .btn-pedir:hover { background: #1DB954; color: black; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1DB954; color: black; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <h1 id="tituloSet">Cargando set musical...</h1>
    <div class="lista-canciones" id="listaCanciones"></div>

    <div class="toast" id="toastMensaje">¡Tema pedido con éxito!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Usá las mismas credenciales de tu proyecto family-game-show
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let urlVideoGlobal = "";

        async function cargarDatos() {
            try {
                const docRef = doc(db, "sets_musicales", "jazz_covers");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('tituloSet').innerText = `🎵 ${data.nombre || 'Jazz Covers'}`;
                    urlVideoGlobal = data.youtubeurl || "";
                    
                    renderizarLista(data.canciones || []);
                } else {
                    document.getElementById('tituloSet').innerText = "No se encontró el repertorio.";
                }
            } catch (error) {
                console.error("Error al leer Firestore:", error);
                document.getElementById('tituloSet').innerText = "Error al cargar la base de datos.";
            }
        }

        function renderizarLista(canciones) {
            const contenedor = document.getElementById('listaCanciones');
            contenedor.innerHTML = '';

            canciones.forEach((cancionTexto) => {
                const div = document.createElement('div');
                div.className = 'item-cancion';
                div.innerHTML = `
                    <div class="info-tema">
                        <span class="titulo">${cancionTexto}</span>
                    </div>
                    <button class="btn-pedir" onclick="pedirTema('${cancionTexto.replace(/'/g, "\\'")}')">Pedir</button>
                `;
                contenedor.appendChild(div);
            });
        }

        window.pedirTema = async function(cancion) {
            try {
                await addDoc(collection(db, "cola_reproduccion"), {
                    cancion: cancion,
                    videoUrl: urlVideoGlobal,
                    pedidoPor: "Invitado",
                    timestamp: serverTimestamp(),
                    estado: "pendiente"
                });

                mostrarToast(`¡"${cancion}" agregado a la cola!`);
            } catch (error) {
                console.error("Error al guardar el pedido:", error);
                alert("No se pudo enviar el pedido.");
            }
        }

        function mostrarToast(mensaje) {
            const toast = document.getElementById('toastMensaje');
            toast.innerText = mensaje;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        cargarDatos();
    </script>
</body>
</html>
