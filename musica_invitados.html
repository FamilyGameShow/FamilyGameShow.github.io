<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Fiesta - Pedí tu tema</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            text-align: center;
        }
        .container { max-width: 500px; margin: auto; }
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        input, button { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; 
            box-sizing: border-box;
        }
        input { background: #2a2a2a; color: #fff; }
        .btn-opcion { background: #7f00ff; color: white; font-weight: bold; cursor: pointer; margin: 6px 0; }
        .btn-opcion:hover { background: #9c27b0; }
        #mensaje { color: #1db954; font-weight: bold; margin-top: 10px; }
        #nombreBloque { color: #ffeb3b; font-size: 20px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Fiesta Interactiva 🎉</h1>

        <div class="card">
            <input type="text" id="nombreUsuario" placeholder="Tu nombre o apodo (Ej: Tito)">
        </div>

        <div class="card">
            <div id="nombreBloque">Cargando momento de la fiesta...</div>
            <p style="color: #aaa; font-size: 14px;">Elegí un tema del bloque actual habilitado por el DJ:</p>
            <div id="listaOpciones">
                <!-- Las opciones cambian dinámicamente según el bloque -->
            </div>
            <p id="mensaje"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Repertorios organizados por los bloques exactos del Admin
        const repertoriosPorBloque = {
            chill: [
                "Jazz Instrumental - Smooth Lounge",
                "Bossa Nova - Acústico Relajado",
                "Norah Jones - Come Away With Me",
                "Frank Sinatra - Fly Me To The Moon"
            ],
            rock: [
                "Soda Stereo - De música ligera",
                "Los Redondos - Jijiji",
                "La Renga - La balada del diablo y la muerte",
                "Charly García - Demoliendo hoteles"
            ],
            "80s": [
                "Michael Jackson - Billie Jean",
                "Depeche Mode - Enjoy The Silence",
                "Soda Stereo - Persiana americana",
                "Madonna - Material Girl"
            ],
            fiesta: [
                "Babasónicos - Irresponsables",
                "Miranda - Don",
                "Callejeros - Prohibido",
                "Akt - Cumbia / Reggaetón Mix"
            ]
        };

        const titulosBloque = {
            chill: "🍔 Momento Comida / Chill",
            rock: "🎸 Bloque de Rock Nacional",
            "80s": "🕺 Hits Retro / 80s & 90s",
            fiesta: "🎉 ¡Momento Bailable & Fiesta!"
        };

        // Escuchar el documento "bloque_musical" en tiempo real desde Firebase
        onSnapshot(doc(db, "fiesta_musical", "bloque_musical"), (docSnap) => {
            let faseActual = "fiesta"; // Valor por defecto
            if (docSnap.exists() && docSnap.data().fase) {
                faseActual = docSnap.data().fase;
            }
            actualizarInterfazBloque(faseActual);
        });

        function actualizarInterfazBloque(fase) {
            document.getElementById("nombreBloque").innerText = titulosBloque[fase] || "🎉 Fiesta en Vivo";
            
            const contenedor = document.getElementById("listaOpciones");
            contenedor.innerHTML = "";

            const temas = repertoriosPorBloque[fase] || repertoriosPorBloque["fiesta"];

            temas.forEach(tema => {
                const btn = document.createElement("button");
                btn.classList.add("btn-opcion");
                btn.innerText = `🎵 ${tema}`;
                btn.onclick = () => enviarTemaSeleccionado(tema);
                contenedor.appendChild(btn);
            });
        }

        window.enviarTemaSeleccionado = async function(tema) {
            const nombre = document.getElementById('nombreUsuario').value.trim();

            if (!nombre) {
                alert("Por favor ingresá tu nombre o apodo antes de pedir un tema.");
                return;
            }

            try {
                await addDoc(collection(db, "cola_reproduccion"), {
                    cancion: tema,
                    pedidoPor: nombre,
                    timestamp: serverTimestamp()
                });

                document.getElementById('mensaje').innerText = `¡Enviado con éxito: "${tema}"! 🎶`;
                setTimeout(() => {
                    document.getElementById('mensaje').innerText = "";
                }, 4000);
            } catch (error) {
                console.error("Error al enviar tema: ", error);
                alert("Hubo un error al enviar el tema.");
            }
        }
    </script>
</body>
</html>
