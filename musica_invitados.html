<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Fiesta - Pedí tu tema</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            text-align: center;
        }
        .container { max-width: 500px; margin: auto; }
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        input, button { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; 
            box-sizing: border-box;
        }
        input { background: #2a2a2a; color: #fff; }
        .btn-opcion { background: #7f00ff; color: white; font-weight: bold; cursor: pointer; text-align: left; padding: 12px 15px; font-size: 15px; }
        .btn-opcion:hover { background: #9c27b0; }

        .seccion { display: none; }
        .activa { display: block; }
        #mensaje { color: #1db954; font-weight: bold; margin-top: 10px; }
        #nombreMomento { color: #ffeb3b; font-size: 20px; margin-bottom: 15px; font-weight: bold; }
        .lista-container { max-height: 380px; overflow-y: auto; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Fiesta Interactiva 🎉</h1>

        <div class="card">
            <input type="text" id="nombreUsuario" placeholder="Tu nombre o apodo (Ej: Tito)">
        </div>

        <!-- SECCIÓN MÚSICA (Carga dinámica desde sets_musicales) -->
        <div id="seccionMusica" class="seccion activa">
            <div class="card">
                <div id="nombreMomento">Cargando set musical...</div>
                <p style="color: #aaa; font-size: 13px; margin-bottom: 15px;">Elegí un tema del set:</p>
                <div class="lista-container" id="listaOpcionesTema"></div>
                <p id="mensaje"></p>
            </div>
        </div>

        <!-- SECCIÓN TRIVIA -->
        <div id="seccionTrivia" class="seccion">
            <div class="card">
                <h2>🧠 ¡Pregunta Flash de la Noche!</h2>
                <p style="font-size: 18px; color: #ffeb3b;">¿De qué año es este tema?</p>
                <button class="btn-opcion" style="text-align: center;" onclick="enviarRespuestaTrivia(1)">Opción 1</button>
                <button class="btn-opcion" style="text-align: center;" onclick="enviarRespuestaTrivia(2)">Opción 2</button>
                <button class="btn-opcion" style="text-align: center;" onclick="enviarRespuestaTrivia(3)">Opción 3</button>
                <p id="mensajeTrivia" style="color: #00e676; font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>

        <!-- SECCIÓN VOTACIÓN -->
        <div id="seccionVotacion" class="seccion">
            <div class="card">
                <h2>🎤 ¿Quién cantó mejor?</h2>
                <p style="color: #aaa;">Votá a tu favorito:</p>
                <button class="btn-opcion" style="text-align: center;" onclick="votarCantante('Participante A')">Participante A</button>
                <button class="btn-opcion" style="text-align: center;" onclick="votarCantante('Participante B')">Participante B</button>
                <p id="mensajeVoto" style="color: #ff5252; font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, onSnapshot, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función auxiliar para convertir "MM:SS" a segundos totales
        function convertirASegundos(tiempoStr) {
            const partes = tiempoStr.split(":");
            if (partes.length === 2) {
                return (parseInt(partes[0]) * 60) + parseInt(partes[1]);
            }
            return 0;
        }

        // Cargar el set "jazz_covers" directo de Firebase
        async function cargarSetMusical() {
            try {
                const docRef = doc(db, "sets_musicales", "jazz_covers");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("nombreMomento").innerText = `🎧 Set: ${(data.nombre || "Jazz").toUpperCase()}`;
                    const urlVideo = data.youtubeurl || "";
                    const textoCanciones = data.canciones || "";
                    
                    const lineas = textoCanciones.split("\n");
                    const contenedor = document.getElementById('listaOpcionesTema');
                    contenedor.innerHTML = "";

                    lineas.forEach(linea => {
                        linea = linea.trim();
                        if (!linea) return;

                        const espacioIdx = linea.indexOf(" ");
                        if (espacioIdx === -1) return;

                        const tiempoStr = linea.substring(0, espacioIdx); // Ej: "10:26"
                        const nombreTema = linea.substring(espacioIdx + 1); // Ej: "Sam Smith..."
                        const segundos = convertirASegundos(tiempoStr);

                        const btn = document.createElement("button");
                        btn.classList.add("btn-opcion");
                        btn.innerText = `🎵 [${tiempoStr}] ${nombreTema}`;
                        btn.onclick = () => enviarTemaSet(nombreTema, segundos, urlVideo);
                        contenedor.appendChild(btn);
                    });
                } else {
                    document.getElementById("nombreMomento").innerText = "Set musical no encontrado.";
                }
            } catch (error) {
                console.error("Error al cargar set:", error);
                document.getElementById("nombreMomento").innerText = "Error al conectar con la base de datos.";
            }
        }

        // Escuchar el cambio de Modo (Música / Trivia / Votación)
        onSnapshot(doc(db, "fiesta_musical", "modo_interactivo"), (docSnap) => {
            if (docSnap.exists()) {
                const modo = docSnap.data().modo || "musica";
                document.querySelectorAll('.seccion').forEach(el => el.classList.remove('activa'));
                if (modo === "trivia") {
                    document.getElementById('seccionTrivia').classList.add('activa');
                } else if (modo === "votacion") {
                    document.getElementById('seccionVotacion').classList.add('activa');
                } else {
                    document.getElementById('seccionMusica').classList.add('activa');
                    cargarSetMusical();
                }
            }
        });

        window.enviarTemaSet = async function(nombreTema, segundosInicio, urlVideo) {
            const nombre = document.getElementById('nombreUsuario').value.trim();
            if (!nombre) {
                alert("Por favor ingresá tu nombre o apodo antes de pedir un tema.");
                return;
            }

            try {
                await addDoc(collection(db, "cola_reproduccion"), {
                    cancion: nombreTema,
                    youtubeUrl: urlVideo,
                    startSeconds: segundosInicio,
                    pedidoPor: nombre,
                    timestamp: serverTimestamp()
                });

                document.getElementById('mensaje').innerText = `¡Enviado: "${nombreTema}"! 🎶`;
                setTimeout(() => { document.getElementById('mensaje').innerText = ""; }, 3000);
            } catch (error) {
                console.error("Error al enviar tema:", error);
                alert("Hubo un error al enviar el pedido.");
            }
        }

        window.enviarRespuestaTrivia = (op) => {
            const nombre = document.getElementById('nombreUsuario').value.trim() || "Anónimo";
            document.getElementById('mensajeTrivia').innerText = `¡Opción ${op} registrada para ${nombre}! 🧠`;
        };

        window.votarCantante = (cand) => {
            const nombre = document.getElementById('nombreUsuario').value.trim() || "Anónimo";
            document.getElementById('mensajeVoto').innerText = `¡Voto para ${cand} registrado! 🎤`;
        };

        // Carga inicial
        cargarSetMusical();
    </script>
</body>
</html>
