<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Control - Family Game Show</title>
    <style>
        body { background: #0a0e17; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #151f32; border: 2px solid #ffd166; padding: 30px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #ffd166; font-size: 1.2rem; margin-bottom: 20px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #0a0e17; border: 1px solid #24344f; border-radius: 8px; margin-bottom: 15px; color: #fff; font-size: 1rem; }
        .btn-panel { display: block; width: 100%; padding: 12px; background: #1e2d4a; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 10px; font-size: 0.85rem; text-align: center; }
        .btn-1 { color: #00f5d4; border: 1px solid #00f5d4; }
        .btn-2 { color: #ffd166; border: 1px solid #ffd166; }
        .btn-3 { color: #ff0055; border: 1px solid #ff0055; }
        .btn-4 { color: #fff; border: 1px solid #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Control de Producción</h2>
        
        <!-- Pantalla de contraseña -->
        <div id="cajaClave">
            <input type="password" id="txtClave" placeholder="Contraseña de Admin">
            <button onclick="validarAdmin()" style="width:100%; padding:12px; background:#00f5d4; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; text-transform:uppercase;">Ingresar</button>
        </div>

        <!-- Botones que se abren al poner la clave -->
        <div id="menuAdmin" style="display:none;">
            <a href="https:/admin_listas" target="_blank" class="btn-panel btn-1">🎛️ 1. Admin Listas y Shows</a>
            <a href="/escenario" target="_blank" class="btn-panel btn-2">⚡ 2. Control de Escenario (Volante)</a>
            <a href="/escenario_control" target="_blank" class="btn-panel btn-3">📺 3. Pantalla Escenario (Proyector)</a>
            <a href="/carton" target="_blank" class="btn-panel btn-4">🎫 4. Mi Cartón (Monitoreo)</a>
        </div>
    </div>

    <script>
        function validarAdmin() {
            const clave = document.getElementById('txtClave').value;
            if (clave === "1180") { // Cambiá "1180" por tu contraseña
                document.getElementById('cajaClave').style.display = 'none';
                document.getElementById('menuAdmin').style.display = 'block';
            } else {
                alert("Contraseña incorrecta");
            }
        }
    </script>
</body>
</html>
